<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inner Domain: 5 Finger Sukuna Trial</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #050508; color: #fff; font-family: 'Rajdhani', sans-serif;
            height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        .vn-container {
            width: 100%; max-width: 900px; height: 100vh; max-height: 600px;
            background: #000; border: 2px solid #ff2a5f; position: relative;
            display: flex; flex-direction: column; justify-content: space-between;
            box-shadow: 0 0 30px rgba(255, 42, 95, 0.5); overflow: hidden;
        }
        .vn-bg {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(255, 42, 95, 0.25) 0%, rgba(5, 5, 8, 0.95) 80%);
            z-index: 1;
        }
        .boss-ui {
            position: relative; z-index: 20; padding: 16px; background: rgba(10, 12, 22, 0.9);
            border-bottom: 1px solid #ff2a5f; display: flex; flex-direction: column; gap: 6px;
        }
        .hp-bar-container {
            width: 100%; height: 18px; background: #1a1a20; border-radius: 8px;
            overflow: hidden; border: 1px solid rgba(255,255,255,0.1); position: relative;
        }
        .hp-bar-fill { height: 100%; background: linear-gradient(90deg, #ff2a5f, #a8002a); width: 100%; transition: width 0.1s linear; }
        .hp-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 0.75rem; font-weight: 700; }
        .arena {
            position: relative; z-index: 10; flex: 1; overflow: hidden; display: flex;
            align-items: center; justify-content: center;
        }
        .thought-bubble {
            position: absolute; background: rgba(255, 42, 95, 0.2); border: 2px solid #ff2a5f;
            color: #fff; padding: 10px 18px; border-radius: 30px; font-weight: 700;
            font-size: 0.9rem; cursor: pointer; box-shadow: 0 0 15px rgba(255, 42, 95, 0.6);
            animation: popIn 0.2s ease-out, fadeOut 1.2s forwards;
        }
        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes fadeOut { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
        .instruction-box {
            position: relative; z-index: 20; padding: 14px; background: rgba(10, 12, 22, 0.9);
            border-top: 1px solid #ff2a5f; text-align: center; font-weight: 700; color: #a1a1aa;
        }
        .back-btn {
            position: absolute; top: 15px; right: 15px; z-index: 30; background: rgba(0,0,0,0.8);
            border: 1px solid #ff2a5f; color: #ff2a5f; padding: 6px 12px; border-radius: 6px;
            text-decoration: none; font-size: 0.8rem; font-weight: 700; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="vn-container">
        <button class="back-btn" onclick="window.location.href='index.html'">Return to Main Game</button>
        <div class="vn-bg"></div>

        <div class="boss-ui">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <strong style="color:#ff2a5f; font-family:'Cinzel', serif;">Sukuna's Malicious Influence (5 Fingers)</strong>
                <span style="font-size:0.8rem; color:#a1a1aa;">Fight Your Conscience!</span>
            </div>
            <div class="hp-bar-container">
                <div class="hp-bar-fill" id="boss-hp-fill"></div>
                <div class="hp-text" id="boss-hp-text">150,000 / 150,000 HP</div>
            </div>
        </div>

        <div class="arena" id="arena"></div>

        <div class="instruction-box">
            <i class="fa-solid fa-brain" style="color:#ff2a5f;"></i> CLICK THE SURGING IMPULSIVE THOUGHTS BEFORE THEY FADE TO SUPPRESS SUKUNA!
        </div>
    </div>

    <script>
        let bossHp = 150000;
        let bossMaxHp = 150000;
        const thoughts = [
            "GIVE IN TO ME!", "KILL THEM ALL!", "LET ME OUT!", "YOU ARE WEAK!",
            "DESTROY THIS CITY!", "SUBMIT TO SUKUNA!", "FEAST ON BLOOD!", "YOU CANNOT STOP ME!"
        ];

        function formatNum(num) { return num >= 1000 ? (num/1000).toFixed(1) + 'k' : Math.floor(num); }

        function updateUI() {
            const pct = Math.max(0, (bossHp / bossMaxHp) * 100);
            document.getElementById('boss-hp-fill').style.width = `${pct}%`;
            document.getElementById('boss-hp-text').innerText = `${formatNum(Math.max(0, bossHp))} / ${formatNum(bossMaxHp)} HP`;
        }

        function spawnThought() {
            if (bossHp <= 0) return;
            const arena = document.getElementById('arena');
            const bubble = document.createElement('div');
            bubble.className = 'thought-bubble';
            bubble.innerText = thoughts[Math.floor(Math.random() * thoughts.length)];

            const x = Math.random() * (arena.clientWidth - 160);
            const y = Math.random() * (arena.clientHeight - 60);
            bubble.style.left = `${x}px`;
            bubble.style.top = `${y}px`;

            bubble.onclick = () => {
                bossHp -= 8500;
                bubble.remove();
                updateUI();
                if (bossHp <= 0) {
                    alert("SUPPRESSION SUCCESSFUL! You quelled Sukuna's inner urges!");
                    window.location.href = "index.html";
                }
            };

            arena.appendChild(bubble);
            setTimeout(() => { if (bubble.parentNode) bubble.remove(); }, 1200);
        }

        setInterval(spawnThought, 450);
        updateUI();
    </script>
</body>
</html>
