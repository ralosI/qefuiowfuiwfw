<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 2: Cursed Womb Must Die - Visual Novel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #050508;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .vn-container {
            width: 100%;
            max-width: 900px;
            height: 100vh;
            max-height: 600px;
            background: #000;
            border: 2px solid #27272a;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        }

        .vn-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            opacity: 0.4;
            filter: brightness(0.5) hue-rotate(300deg);
            z-index: 1;
        }

        .sprite-container {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            height: 75%;
            z-index: 2;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .character-sprite {
            max-height: 100%;
            max-width: 450px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.8));
            transition: opacity 0.2s ease;
        }

        .dialogue-box {
            position: relative;
            z-index: 10;
            width: 92%;
            margin: 0 auto 20px auto;
            background: rgba(10, 12, 22, 0.94);
            border: 2px solid #00d2ff;
            border-radius: 8px;
            padding: 22px 25px;
            min-height: 120px;
            box-shadow: 0 4px 25px rgba(0, 210, 255, 0.15);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .name-tag {
            position: absolute;
            top: -18px;
            left: 20px;
            background: linear-gradient(90deg, #00d2ff 0%, #0072ff 100%);
            color: #000;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 4px 18px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 2px 10px rgba(0, 210, 255, 0.4);
        }

        .dialogue-text {
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.5;
            color: #f4f4f5;
            margin-top: 5px;
        }

        .next-prompt {
            align-self: flex-end;
            font-size: 0.85rem;
            color: #00d2ff;
            animation: bounce 0.8s infinite alternate;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(5px); }
        }

        .back-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #3f3f46;
            color: #a1a1aa;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            transition: all 0.2s;
        }

        .back-btn:hover {
            color: #fff;
            border-color: #00d2ff;
        }
    </style>
</head>
<body>

    <div class="vn-container">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-xmark"></i> Exit Story</a>
        <div class="vn-bg"></div>

        <div class="sprite-container">
            <img id="char-sprite" class="character-sprite" src="" alt="Character">
        </div>

        <div class="dialogue-box" id="dialogue-box">
            <div class="name-tag" id="name-tag">NAME</div>
            <div class="dialogue-text" id="dialogue-text">...</div>
            <div class="next-prompt">
                <span>CLICK / TAP TO CONTINUE</span>
                <i class="fa-solid fa-caret-down"></i>
            </div>
        </div>
    </div>

    <script>
        const IMAGES = {
            yuji_normal: "https://static.wikia.nocookie.net/deathbattlefanon/images/9/9d/Yuji_Itadori_28Anime_2_29.png/revision/latest?cb=20220816213413",
            yuji_serious: "https://static.wikia.nocookie.net/p__/images/1/1d/Yuji_Itadori_%28Anime_3%29.png/revision/latest/scale-to-width/360?cb=20260330045757&path-prefix=protagonist",
            megumi_normal: "https://i.redd.it/irbla1eyzpjc1.png",
            megumi_serious: "https://i.namu.wiki/i/faGt6W5lJzCGV_1Vubiy8bPvYJWHGOuysNKlAU1lq3OPkiKvzDRN9KxmhS98M7UOtCNIkSr8UvpCrEq5TFoRYw.webp",
            nobara_normal: "https://static.wikia.nocookie.net/characterprofile/images/2/22/Nobara_Kugisaki_29.webp/revision/latest?cb=20250126032823",
            nobara_serious: "https://static.wikia.nocookie.net/jujutsu-kaisen/images/d/dd/Nobara_Kugisaki_%28Anime_2%29.png/revision/latest?cb=20240621133809",
            sukuna: "https://static.wikia.nocookie.net/vsbattles/images/4/41/Yuuji_7.png/revision/latest/scale-to-width-down/200?cb=20251011220423"
        };

        const script = [
            { speaker: "Nobara Kugisaki", sprite: IMAGES.nobara_normal, text: "So this is Eishu Detention Center? What a grim place." },
            { speaker: "Megumi Fushiguro", sprite: IMAGES.megumi_serious, text: "Stay alert, Kugisaki. Ijichi said a Cursed Womb appeared here. If it hatches, it could become a Special Grade." },
            { speaker: "Yuji Itadori", sprite: IMAGES.yuji_normal, text: "Special Grade... that means it's super strong, right? Don't worry, we'll save whoever is inside!" },
            { speaker: "Megumi Fushiguro", sprite: IMAGES.megumi_serious, text: "Our priority is confirming survivors and evacuating. Do NOT pick a fight with a Special Grade." },
            { speaker: "Nobara Kugisaki", sprite: IMAGES.nobara_serious, text: "Hey... look at the building. The layout... it transformed! Where did the exit go?!" },
            { speaker: "Megumi Fushiguro", sprite: IMAGES.megumi_serious, text: "An incomplete Domain Expansion... We're trapped inside!" },
            { speaker: "Yuji Itadori", sprite: IMAGES.yuji_serious, text: "Guh...! What is this pressure?! My body... I can barely move!" },
            { speaker: "Megumi Fushiguro", sprite: IMAGES.megumi_serious, text: "It's here! The Cursed Womb already hatched!" },
            { speaker: "Yuji Itadori", sprite: IMAGES.yuji_serious, text: "AAAAAAHHH! MY HAND! IT CHOPPED OFF MY HAND IN A SPLIT SECOND!" },
            { speaker: "Nobara Kugisaki", sprite: IMAGES.nobara_serious, text: "ITADORI! NO!" },
            { speaker: "Yuji Itadori", sprite: IMAGES.yuji_serious, text: "Fushiguro! Take Kugisaki and run out of the building right now!" },
            { speaker: "Megumi Fushiguro", sprite: IMAGES.megumi_serious, text: "What about you?! You can't beat this thing alone!" },
            { speaker: "Yuji Itadori", sprite: IMAGES.yuji_serious, text: "I'll buy you time! Once you give me the signal that you're outside... I'll switch with Sukuna!" },
            { speaker: "Megumi Fushiguro", sprite: IMAGES.megumi_serious, text: "...Got it! Don't you dare die, Itadori!" },
            { speaker: "Yuji Itadori", sprite: IMAGES.yuji_serious, text: "(There's the signal howl from Divine Dog! Alright... Sukuna, take over!)" },
            { speaker: "Ryomen Sukuna", sprite: IMAGES.sukuna, text: "Aha... Hahaha! You swapped with me just to fight this pathetic bug?" },
            { speaker: "Ryomen Sukuna", sprite: IMAGES.sukuna, text: "Hey curse... look at you, so proud of your little Cursed Energy. Let me show you what true Jujutsu looks like." },
            { speaker: "Ryomen Sukuna", sprite: IMAGES.sukuna, text: "Domain Expansion: Malevolent Shrine." },
            { speaker: "Ryomen Sukuna", sprite: IMAGES.sukuna, text: "Slice... Slay. You've been cut into pieces before you even realized it." },
            { speaker: "Ryomen Sukuna", sprite: IMAGES.sukuna, text: "Now then... that brat isn't coming back, is he? Perfect time to have some fun with Fushiguro outside!" }
        ];

        let currentIndex = 0;
        const nameTag = document.getElementById('name-tag');
        const dialogueText = document.getElementById('dialogue-text');
        const charSprite = document.getElementById('char-sprite');
        const dialogueBox = document.getElementById('dialogue-box');

        function renderScene() {
            const current = script[currentIndex];
            nameTag.innerText = current.speaker;
            dialogueText.innerText = current.text;

            if (current.sprite) {
                charSprite.style.opacity = "1";
                charSprite.src = current.sprite;
            } else {
                charSprite.style.opacity = "0";
            }

            if (current.speaker.includes("Sukuna")) {
                nameTag.style.background = "linear-gradient(90deg, #ff2a5f 0%, #a8002a 100%)";
                document.querySelector('.dialogue-box').style.borderColor = "#ff2a5f";
            } else if (current.speaker.includes("Nobara")) {
                nameTag.style.background = "linear-gradient(90deg, #f59e0b 0%, #d97706 100%)";
                document.querySelector('.dialogue-box').style.borderColor = "#f59e0b";
            } else if (current.speaker.includes("Megumi")) {
                nameTag.style.background = "linear-gradient(90deg, #6366f1 0%, #4338ca 100%)";
                document.querySelector('.dialogue-box').style.borderColor = "#6366f1";
            } else {
                nameTag.style.background = "linear-gradient(90deg, #00d2ff 0%, #0072ff 100%)";
                document.querySelector('.dialogue-box').style.borderColor = "#00d2ff";
            }
        }

        dialogueBox.addEventListener('click', () => {
            currentIndex++;
            if (currentIndex < script.length) {
                renderScene();
            } else {
                alert("Chapter 2 Completed! Returning to main game.");
                window.location.href = "index.html";
            }
        });

        renderScene();
    </script>
</body>
</html>
