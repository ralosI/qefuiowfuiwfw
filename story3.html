<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 3: Kyoto Sister-School Event - Visual Novel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #050508;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .vn-container {
            width: 100%;
            max-width: 900px;
            height: 100vh;
            max-height: 600px;
            background: #000;
            border: 2px solid #27272a;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        }

        .vn-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/ba276707-fe1d-417c-aa5c-af799ca32d89/dgczncp-ea1fe9ce-3793-4a52-91d5-86c7a2d3faad.png/v1/fill/w_1192,h_670,q_70,strp/jjk_background_school_grounds_by_backgroundsacademia_dgczncp-pre.jpg?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7ImhlaWdodCI6Ijw9MTA4MCIsInBhdGgiOiIvZi9iYTI3NjcwNy1mZTFkLTQxN2MtYWE1Yy1hZjc5OWNhMzJkODkvZGdjem5jcC1lYTFmZTljZS0zNzkzLTRhNTItOTFkNS04NmM3YTJkM2ZhYWQucG5nIiwid2lkdGgiOiI8PTE5MjAifV1dLCJhdWQiOlsidXJuOnNlcnZpY2U6aW1hZ2Uub3BlcmF0aW9ucyJdfQ.mq9S-UUKRkuEVB0yk6HeV8Cb-mcQiSx2yeGBex0bRlQ');
            background-size: cover;
            background-position: center;
            opacity: 0.55;
            filter: brightness(0.7) contrast(1.1);
            z-index: 1;
        }

        .sprite-container {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            height: 75%;
            z-index: 2;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .character-sprite {
            max-height: 100%;
            max-width: 450px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.8));
            transition: opacity 0.2s ease;
        }

        .dialogue-box {
            position: relative;
            z-index: 10;
            width: 92%;
            margin: 0 auto 20px auto;
            background: rgba(10, 12, 22, 0.94);
            border: 2px solid #00d2ff;
            border-radius: 8px;
            padding: 22px 25px;
            min-height: 120px;
            box-shadow: 0 4px 25px rgba(0, 210, 255, 0.15);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .name-tag {
            position: absolute;
            top: -18px;
            left: 20px;
            background: linear-gradient(90deg, #00d2ff 0%, #0072ff 100%);
            color: #000;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 4px 18px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 2px 10px rgba(0, 210, 255, 0.4);
        }

        .dialogue-text {
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.5;
            color: #f4f4f5;
            margin-top: 5px;
        }

        .next-prompt {
            align-self: flex-end;
            font-size: 0.85rem;
            color: #00d2ff;
            animation: bounce 0.8s infinite alternate;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(5px); }
        }

        .back-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #3f3f46;
            color: #a1a1aa;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            transition: all 0.2s;
        }

        .back-btn:hover {
            color: #fff;
            border-color: #00d2ff;
        }
    </style>
</head>
<body>

    <div class="vn-container">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-xmark"></i> Exit Story</a>
        <div class="vn-bg"></div>

        <div class="sprite-container">
            <img id="char-sprite" class="character-sprite" src="" alt="Character">
        </div>

        <div class="dialogue-box" id="dialogue-box">
            <div class="name-tag" id="name-tag">NAME</div>
            <div class="dialogue-text" id="dialogue-text">...</div>
            <div class="next-prompt">
                <span>CLICK / TAP TO CONTINUE</span>
                <i class="fa-solid fa-caret-down"></i>
            </div>
        </div>
    </div>

    <script>
        const IMAGES = {
            yuji_serious: "https://static.wikia.nocookie.net/deathbattlefanon/images/9/9d/Yuji_Itadori_28Anime_2_29.png/revision/latest?cb=20220816213413",
            yuji_normal: "https://static.wikia.nocookie.net/p__/images/1/1d/Yuji_Itadori_%28Anime_3%29.png/revision/latest/scale-to-width/360?cb=20260330045757&path-prefix=protagonist",
            todo_normal: "https://static.wikia.nocookie.net/jujutsu-kaisen/images/7/79/Aoi_Todo_%28Anime%29.png/revision/latest?cb=20240621022047",
            todo_serious: "https://static.wikia.nocookie.net/versus-connections/images/b/bc/Aoi_Todo_Phantom_Parade.webp/revision/latest/scale-to-width-down/692?cb=20231224031207",
            hanami_normal: "https://static.wikia.nocookie.net/jujutsu-kaisen/images/7/76/Hanami_%28Anime%29.png/revision/latest?cb=20210318193331",
            hanami_serious: "https://static.wikia.nocookie.net/villains/images/d/da/Hanami.png/revision/latest?cb=20251009144926"
        };

        const script = [
            { speaker: "Aoi Todo", sprite: IMAGES.todo_normal, text: "Oi... Itadori Yuji. Before we start beating each other up in this Goodwill Event, I have one question for you." },
            { speaker: "Yuji Itadori", sprite: IMAGES.yuji_normal, text: "Huh? What question?" },
            { speaker: "Aoi Todo", sprite: IMAGES.todo_serious, text: "What kind of girl is your type? Answer honestly, or I'll beat you half to death right here!" },
            { speaker: "Yuji Itadori", sprite: IMAGES.yuji_normal, text: "Well... if I had to say... a tall girl with a big ass! Like Jennifer Lawrence!" },
            { speaker: "Aoi Todo", sprite: IMAGES.todo_serious, text: "I SEE... YOU HAVE EXCELLENT TASTE! YOU ARE MY BEST FRIEND!" },
            { speaker: "Yuji Itadori", sprite: IMAGES.yuji_normal, text: "Wait, best friend?! We just met!" },
            { speaker: "Hanami", sprite: IMAGES.hanami_normal, text: "*(A heavy, ominous cursed pressure suddenly fills the forest environment...)*" },
            { speaker: "Aoi Todo", sprite: IMAGES.todo_serious, text: "A Special Grade Curse invasion?! Perfect! Takada-chan is watching us from above, brother!" },
            { speaker: "Yuji Itadori", sprite: IMAGES.yuji_serious, text: "This curse is super tough! My Divergent Fist isn't doing enough damage!" },
            { speaker: "Aoi Todo", sprite: IMAGES.todo_serious, text: "Listen to me, brother! Stop relying on Divergent Fist! You're letting your Cursed Energy lag behind your physical impact!" },
            { speaker: "Aoi Todo", sprite: IMAGES.todo_serious, text: "Cursed Energy and physical power are not two separate things! Align them... channel the energy within 0.000001 seconds of impact!" },
            { speaker: "Yuji Itadori", sprite: IMAGES.yuji_serious, text: "(Flow... don't force it. Feel the spatial distortion... right at the point of contact!)" },
            { speaker: "Hanami", sprite: IMAGES.hanami_serious, text: "*(Sprouts massive wooden roots to crush Yuji)*" },
            { speaker: "Yuji Itadori", sprite: IMAGES.yuji_serious, text: "TAKE THIS... BLACK FLASH!" },
            { speaker: "Aoi Todo", sprite: IMAGES.todo_serious, text: "MAGNIFICENT! Pitch-black sparks of spatial distortion! You've stepped into the Zone, my brother!" }
        ];

        let currentIndex = 0;
        const nameTag = document.getElementById('name-tag');
        const dialogueText = document.getElementById('dialogue-text');
        const charSprite = document.getElementById('char-sprite');
        const dialogueBox = document.getElementById('dialogue-box');

        function renderScene() {
            const current = script[currentIndex];
            nameTag.innerText = current.speaker;
            dialogueText.innerText = current.text;

            if (current.sprite) {
                charSprite.style.opacity = "1";
                charSprite.src = current.sprite;
            } else {
                charSprite.style.opacity = "0";
            }

            if (current.speaker.includes("Todo")) {
                nameTag.style.background = "linear-gradient(90deg, #10b981 0%, #047857 100%)";
                document.querySelector('.dialogue-box').style.borderColor = "#10b981";
            } else if (current.speaker.includes("Hanami")) {
                nameTag.style.background = "linear-gradient(90deg, #8b5cf6 0%, #6d28d9 100%)";
                document.querySelector('.dialogue-box').style.borderColor = "#8b5cf6";
            } else {
                nameTag.style.background = "linear-gradient(90deg, #00d2ff 0%, #0072ff 100%)";
                document.querySelector('.dialogue-box').style.borderColor = "#00d2ff";
            }
        }

        dialogueBox.addEventListener('click', () => {
            currentIndex++;
            if (currentIndex < script.length) {
                renderScene();
            } else {
                alert("Chapter 3 Completed! Returning to main game.");
                window.location.href = "index.html";
            }
        });

        renderScene();
    </script>
</body>
</html>
